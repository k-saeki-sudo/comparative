<!DOCTYPE html>
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語 比較級チェッカー</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f4f8; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h1 { font-size: 1.4rem; color: #1e3a8a; margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 12px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 6px; background-color: #f8fafc; border-left: 5px solid #2563eb; display: none; }
        .result-box.error { border-left-color: #dc2626; background-color: #fef2f2; }
        .result-title { font-size: 1.2rem; font-weight: bold; color: #0f172a; margin-bottom: 5px; }
        .result-box.error .result-title { color: #dc2626; }
        .result-detail { color: #475569; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>比較級チェッカー</h1>
    <input type="text" id="wordInput" placeholder="形容詞・副詞を入力 (例: happy, famous)" onkeydown="if(event.key==='Enter') check()">
    <button onclick="check()">判定する</button>

    <div id="resultBox" class="result-box">
        <div id="resultTitle" class="result-title"></div>
        <div id="resultDetail" class="result-detail"></div>
    </div>
</div>

<script>
// 1. 不規則変化の定義
const IRREGULAR = {
    "good": "better", "bad": "worse", "far": "farther / further",
    "little": "less", "much": "more", "many": "more"
};

// 2. 中学・高校レベルの主要な形容詞・副詞リスト（超高速照合用）
const VALID_WORDS = new Set([
    "good", "bad", "far", "little", "much", "many",
    "big", "small", "tall", "short", "long", "fast", "slow", "high", "low",
    "hard", "easy", "happy", "sad", "early", "late", "new", "old", "young",
    "hot", "cold", "warm", "cool", "rich", "poor", "dark", "light", "heavy",
    "deep", "shallow", "clean", "dirty", "cheap", "dear", "near", "kind",
    "nice", "fine", "safe", "wide", "large", "bright", "strong", "weak",
    "busy", "funny", "sunny", "windy", "cloudy", "rainy", "pretty", "heavy",
    "lucky", "angry", "hungry", "healthy", "friendly", "lovely",
    "famous", "useful", "careful", "helpful", "active", "beauty", "beautiful",
    "important", "interesting", "difficult", "expensive", "popular", "exciting",
    "dangerous", "convenient", "wonderful", "necessary", "impossible",
    "quiet", "clever", "simple", "narrow", "shallow", "gentle",
    "well", "hardly", "slowly", "quickly", "easily", "clearly", "carefully"
]);

function countSyllables(word) {
    word = word.toLowerCase();
    if (word.length <= 3) return 1;
    word = word.replace(/(?:[^laeiouy]|ed|es|e)$/, '').replace(/^y/, '');
    const matches = word.match(/[aeiouy]{1,2}/g);
    return matches ? matches.length : 1;
}

function showError(message) {
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultDetail = document.getElementById("resultDetail");

    resultBox.className = "result-box error";
    resultBox.style.display = "block";
    resultTitle.textContent = "エラー";
    resultDetail.textContent = message;
}

function check() {
    const wordInput = document.getElementById("wordInput");
    const word = wordInput.value.trim().toLowerCase();
    const resultBox = document.getElementById("resultBox");
    const resultTitle = document.getElementById("resultTitle");
    const resultDetail = document.getElementById("resultDetail");

    if (!word) return;

    // A. 英字以外の入力（数字や日本語など）をチェック
    if (!/^[a-z]+$/.test(word)) {
        showError("入力された単語のつづりが間違っています。もう一度確認して入力してください。");
        return;
    }

    // B. ローカル辞書リストに存在するかチェック（高速判定）
    if (!VALID_WORDS.has(word)) {
        showError("入力された単語のつづりが間違っています。もう一度確認して入力してください。");
        return;
    }

    // 判定結果の表示準備
    resultBox.className = "result-box";
    resultBox.style.display = "block";

    // C. 不規則変化の判定
    if (IRREGULAR[word]) {
        resultTitle.textContent = `比較級: ${IRREGULAR[word]}`;
        resultDetail.textContent = "ルール: 不規則変化（特別な形で覚える単語）です。";
        return;
    }

    // D. 規則変化の判定
    const syllables = countSyllables(word);

    if (syllables === 1) {
        resultTitle.textContent = `比較級: ${word}er`;
        resultDetail.textContent = "ルール: 1音節の短い単語なので、後ろに -er をつけます。";
    } else if (syllables === 2) {
        if (word.endsWith('y')) {
            const form = word.slice(0, -1) + "ier";
            resultTitle.textContent = `比較級: ${form}`;
            resultDetail.textContent = "ルール: 2音節で語尾が -y のため、y を i に変えて -er をつけます。";
        } else if (word.endsWith('le') || word.endsWith('er') || word.endsWith('ow')) {
            resultTitle.textContent = `比較級: ${word}er`;
            resultDetail.textContent = "ルール: 2音節ですが、語尾が -le/-er/-ow のため -er をつけます。";
        } else {
            resultTitle.textContent = `比較級: more ${word}`;
            resultDetail.textContent = "ルール: 2音節の多くの単語は、前に more をつけます。";
        }
    } else {
        resultTitle.textContent = `比較級: more ${word}`;
        resultDetail.textContent = "ルール: 3音節以上の長い単語なので、前に more をつけます。";
    }
}
</script>

</body>
</html>
